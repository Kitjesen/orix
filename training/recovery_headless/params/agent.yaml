seed: 42
device: cuda:0
num_steps_per_env: 48
max_iterations: 2500
empirical_normalization: false
obs_groups: {}
clip_actions: null
save_interval: 200
experiment_name: orix_frnet_flat_paper_v5
run_name: orix_headless_v5_eps025_t17_scratch_2500
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: model_.*.pt
class_name: OnPolicyRunner
policy:
  class_name: ActorCritic
  init_noise_std: 0.3
  noise_std_type: scalar
  actor_obs_normalization: false
  critic_obs_normalization: false
  actor_hidden_dims:
  - 512
  - 256
  - 128
  critic_hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
algorithm:
  class_name: PPO
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.0003
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.005
  desired_kl: 0.01
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  rnd_cfg: null
  symmetry_cfg: null
  zero_action_l2_coef: 0.0
  action_distribution_overflow_coef: 0.0
bootstrap_timeouts: true
bounded_actions: true
mcp_update_after_ppo: true
mcp_policy_kl_limit: 0.01
observation_normalization: true
mcp_decoder_condition_on_predictions: true
